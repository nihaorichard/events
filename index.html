<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Veranstaltungen Weimar</title>


<style>

/* =========================================================
   EASY SETTINGS
   ========================================================= */

:root {

    /* NUMBER OF COLUMNS */
    --columns: 6;

    /* NUMBER OF EVENTS TO SHOW */
    --events: 35;

    /* CARD HEIGHT */
    --card-height: 290px;

    /* IMAGE HEIGHT */
    --image-height: 125px;

    /* GAP BETWEEN CARDS */
    --gap: 12px;

    /* PAGE EDGE */
    --page-padding: 14px;

    /* CARD CORNER */
    --radius: 8px;

    /* =====================================================
       CHANGE THESE COLORS
       ===================================================== */

    /* HEADER / VERANSTALTUNGEN BAR */
    --title-bar-color: #e30613;

    /* BACKGROUND BETWEEN CARDS */
    --grid-background: #f8dede;

    /* PAGE BACKGROUND */
    --page-background: #f8dede;

    /* CARD BACKGROUND */
    --card-background: #ffffff;


    /* =====================================================
       TEXT SIZES
       ===================================================== */

    /* CATEGORY */
    --category-size: 13px;

    /* EVENT TITLE */
    --title-size: 20px;

    /* DATE */
    --date-size: 14px;

    /* DESCRIPTION */
    --description-size: 10px;

    /* PRICE */
    --price-size: 15px;

}


/* =========================================================
   GENERAL
   ========================================================= */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;

    min-height: 100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        var(--page-background);

    color:
        #111;

}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    min-height: 58px;

    display: flex;

    align-items: center;

    padding:
        0 var(--page-padding);

    background:
        var(--title-bar-color);

    color:
        white;

    border-bottom:
        1px solid rgba(0,0,0,0.15);

}


.header-title {

    font-size: 24px;

    font-weight: 700;

    margin: 0;

    color:
        white;

}


.header-status {

    margin-left: auto;

    font-size: 12px;

    color:
        rgba(255,255,255,0.85);

}


/* =========================================================
   EVENT GRID
   ========================================================= */

#events {

    display: grid;

    grid-template-columns:
        repeat(
            var(--columns),
            minmax(0, 1fr)
        );

    gap:
        var(--gap);

    padding:
        var(--page-padding);

    /*
     * IMPORTANT:
     * The background is the color visible
     * between the cards.
     */

    background:
        var(--grid-background);

    /*
     * Allow the grid to grow to all events.
     */

    min-height:
        calc(100vh - 58px);

    height:
        auto;

    overflow:
        visible;

}


/* =========================================================
   EVENT CARD
   ========================================================= */

.event {

    height:
        var(--card-height);

    min-width:
        0;

    background:
        var(--card-background);

    border-radius:
        var(--radius);

    overflow:
        hidden;

    display:
        flex;

    flex-direction:
        column;

    box-shadow:
        0 1px 5px rgba(0,0,0,0.14);

    cursor:
        pointer;

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;

}


/* =========================================================
   OPTIONAL CARD HOVER
   ========================================================= */

.event:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 4px 10px rgba(0,0,0,0.18);

}


/* =========================================================
   IMAGE
   ========================================================= */

.event-image {

    width:
        100%;

    height:
        var(--image-height);

    flex-shrink:
        0;

    overflow:
        hidden;

    background:
        #dddddd;

}


.event-image img {

    width:
        100%;

    height:
        100%;

    display:
        block;

    object-fit:
        cover;

}


/* =========================================================
   EVENT CONTENT
   ========================================================= */

.event-content {

    padding:
        11px 13px 12px;

    display:
        flex;

    flex-direction:
        column;

    flex:
        1;

    min-height:
        0;

}


/* =========================================================
   CATEGORY
   ========================================================= */

.event-category {

    font-size:
        var(--category-size);

    line-height:
        1.2;

    color:
        #888888;

    font-weight:
        600;

    margin-bottom:
        4px;

}


/* =========================================================
   TITLE
   ========================================================= */

.event-title {

    font-size:
        var(--title-size);

    line-height:
        1.15;

    font-weight:
        700;

    color:
        #111111;

    margin-bottom:
        8px;

}


/* =========================================================
   DATE / TIME
   ========================================================= */

.event-date {

    font-size:
        var(--date-size);

    font-weight:
        600;

    color:
        #222222;

    margin-bottom:
        9px;

}


/* =========================================================
   DESCRIPTION
   ========================================================= */

.event-description {

    font-size:
        var(--description-size);

    line-height:
        1.35;

    color:
        #444444;

    overflow:
        hidden;

    display:
        -webkit-box;

    -webkit-box-orient:
        vertical;

    -webkit-line-clamp:
        7;

}


/* =========================================================
   PRICE
   ========================================================= */

.event-price {

    margin-top:
        auto;

    padding-top:
        8px;

    font-size:
        var(--price-size);

    font-weight:
        700;

    color:
        #111111;

}


/* =========================================================
   NO IMAGE
   ========================================================= */

.no-image {

    width:
        100%;

    height:
        100%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:
        #999999;

    font-size:
        13px;

}


/* =========================================================
   LOADING
   ========================================================= */

.loading {

    grid-column:
        1 / -1;

    padding:
        50px;

    text-align:
        center;

    color:
        #777;

}


/* =========================================================
   ERROR
   ========================================================= */

.error {

    grid-column:
        1 / -1;

    padding:
        50px;

    text-align:
        center;

    color:
        #b00000;

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

/*
 * Large screens:
 * 6 columns
 */

@media (min-width: 1101px) {

    :root {

        --columns: 6;

    }

}


/*
 * Medium screens:
 * 4 columns
 */

@media (max-width: 1100px) {

    :root {

        --columns: 4;

    }

}


/*
 * Smaller screens:
 * 2 columns
 */

@media (max-width: 750px) {

    :root {

        --columns: 2;

    }

}


/*
 * Phones:
 * 1 column
 */

@media (max-width: 480px) {

    :root {

        --columns: 1;

    }

}

</style>

</head>


<body>


<!-- ======================================================
     HEADER
     ====================================================== -->

<header class="header">

    <h1 class="header-title">
        Veranstaltungen Weimar
    </h1>

    <div
        class="header-status"
        id="status"
    >
        Lade …
    </div>

</header>


<!-- ======================================================
     EVENT GRID
     ====================================================== -->

<main id="events">

    <div class="loading">
        Veranstaltungen werden geladen …
    </div>

</main>


<script>

/* =========================================================
   CLOUDFLARE WORKER
   ========================================================= */

const API_URL =
    "https://events.richardthiele03.workers.dev";


/* =========================================================
   NUMBER OF EVENTS
   =========================================================

   CHANGE THIS NUMBER IF YOU WANT.

   35 = maximum requested here.

   IMPORTANT:
   This is the actual setting used by JavaScript.
   The CSS --events variable is only informational.
   ========================================================= */

const EVENT_COUNT = 35;


/* =========================================================
   REFRESH TIME
   =========================================================

   10 minutes
   ========================================================= */

const REFRESH_TIME =
    10 * 60 * 1000;


/* =========================================================
   LOAD EVENTS
   ========================================================= */

async function loadEvents() {

    const container =
        document.getElementById(
            "events"
        );

    const status =
        document.getElementById(
            "status"
        );


    try {

        status.textContent =
            "Aktualisiere …";


        const response =
            await fetch(
                API_URL +
                "?t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (
            !data.success ||
            !Array.isArray(
                data.events
            )
        ) {

            throw new Error(
                "Ungültige Daten"
            );

        }


        /*
         * Take the requested number
         * from the Worker.
         *
         * If Worker has 25 events,
         * all 25 are shown.
         *
         * If Worker has 35 events,
         * all 35 are shown.
         */

        const events =
            data.events.slice(
                0,
                EVENT_COUNT
            );


        /*
         * Clear old cards.
         */

        container.innerHTML =
            "";


        /*
         * No events.
         */

        if (
            events.length === 0
        ) {

            container.innerHTML = `
                <div class="loading">
                    Keine Veranstaltungen gefunden.
                </div>
            `;

        }


        /*
         * Create cards.
         */

        else {

            for (
                const event
                of events
            ) {

                container.appendChild(
                    createEventCard(
                        event
                    )
                );

            }

        }


        /*
         * Status.
         */

        const now =
            new Date();


        status.textContent =
            `${events.length} Veranstaltungen · ` +
            `${now.toLocaleTimeString(
                "de-DE",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            )}`;


    } catch (error) {

        console.error(
            error
        );


        container.innerHTML = `

            <div class="error">

                Veranstaltungen konnten
                nicht geladen werden.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;


        status.textContent =
            "Fehler";

    }

}


/* =========================================================
   CREATE EVENT CARD
   ========================================================= */

function createEventCard(
    event
) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "event";


    /*
     * Clicking the card opens
     * the original event page.
     */

    card.onclick =
        function () {

            if (
                event.url
            ) {

                window.open(
                    event.url,
                    "_blank"
                );

            }

        };


    /* =====================================================
       IMAGE
       ===================================================== */

    const imageContainer =
        document.createElement(
            "div"
        );


    imageContainer.className =
        "event-image";


    if (
        event.image
    ) {

        const image =
            document.createElement(
                "img"
            );


        image.src =
            event.image;


        image.alt =
            event.title ||
            "";


        image.loading =
            "lazy";


        image.onerror =
            function () {

                imageContainer.innerHTML =
                    `<div class="no-image">
                        Kein Bild
                    </div>`;

            };


        imageContainer.appendChild(
            image
        );

    }

    else {

        imageContainer.innerHTML =
            `<div class="no-image">
                Kein Bild
            </div>`;

    }


    /* =====================================================
       CONTENT
       ===================================================== */

    const content =
        document.createElement(
            "div"
        );


    content.className =
        "event-content";


    /* =====================================================
       CATEGORY
       ===================================================== */

    if (
        event.category
    ) {

        const category =
            document.createElement(
                "div"
            );


        category.className =
            "event-category";


        category.textContent =
            event.category;


        content.appendChild(
            category
        );

    }


    /* =====================================================
       TITLE
       ===================================================== */

    const title =
        document.createElement(
            "div"
        );


    title.className =
        "event-title";


    title.textContent =
        event.title ||
        "Veranstaltung";


    content.appendChild(
        title
    );


    /* =====================================================
       DATE + TIME
       ===================================================== */

    if (
        event.date ||
        event.time
    ) {

        const date =
            document.createElement(
                "div"
            );


        date.className =
            "event-date";


        let dateText =
            "";


        if (
            event.date
        ) {

            dateText +=
                event.date;

        }


        if (
            event.time
        ) {

            if (
                dateText
            ) {

                dateText +=
                    " · ";

            }


            dateText +=
                formatTime(
                    event.time
                );

        }


        date.textContent =
            dateText;


        content.appendChild(
            date
        );

    }


    /* =====================================================
       DESCRIPTION
       ===================================================== */

    if (
        event.description
    ) {

        const description =
            document.createElement(
                "div"
            );


        description.className =
            "event-description";


        description.textContent =
            event.description;


        content.appendChild(
            description
        );

    }


    /* =====================================================
       PRICE
       ===================================================== */

    if (
        event.price &&
        isPositivePrice(
            event.price
        )
    ) {

        const price =
            document.createElement(
                "div"
            );


        price.className =
            "event-price";


        price.textContent =
            event.price;


        content.appendChild(
            price
        );

    }


    /* =====================================================
       ASSEMBLE CARD
       ===================================================== */

    card.appendChild(
        imageContainer
    );


    card.appendChild(
        content
    );


    return card;

}


/* =========================================================
   TIME FORMAT
   ========================================================= */

function formatTime(
    value
) {

    if (
        !value
    ) {

        return "";

    }


    return value
        .replace(
            /\s*Uhr\s*$/i,
            ""
        ) +
        " Uhr";

}


/* =========================================================
   PRICE CHECK
   ========================================================= */

function isPositivePrice(
    value
) {

    const number =
        parseFloat(
            String(value)
                .replace(
                    /€/g,
                    ""
                )
                .replace(
                    /\s/g,
                    ""
                )
                .replace(
                    ",",
                    "."
                )
        );


    return (
        Number.isFinite(
            number
        ) &&
        number > 0
    );

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(
    value
) {

    return String(
        value
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

loadEvents();


/* =========================================================
   AUTOMATIC REFRESH
   ========================================================= */

setInterval(
    loadEvents,
    REFRESH_TIME
);

</script>


</body>

</html>
