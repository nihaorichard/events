<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Veranstaltungen Weimar</title>


<style>

/* =========================================================
   EASY SETTINGS
   ========================================================= */

:root {

    /* NUMBER OF COLUMNS */
    --columns: 4;

    /* NUMBER OF ROWS / EVENTS */
    --events: 16;

    /* CARD HEIGHT */
    --card-height: 340px;

    /* IMAGE HEIGHT */
    --image-height: 150px;

    /* GAP BETWEEN CARDS */
    --gap: 12px;

    /* PAGE EDGE */
    --page-padding: 14px;

    /* CARD CORNER */
    --radius: 8px;

    /* CATEGORY */
    --category-size: 13px;

    /* TITLE */
    --title-size: 20px;

    /* DATE */
    --date-size: 14px;

    /* DESCRIPTION */
    --description-size: 14px;

    /* PRICE */
    --price-size: 15px;

}


/* =========================================================
   GENERAL
   ========================================================= */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f1f2f4;

    color: #111;

}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    height: 58px;

    display: flex;

    align-items: center;

    padding:
        0 var(--page-padding);

    background: white;

    border-bottom:
        1px solid #d5d5d5;

}


.header-title {

    font-size: 24px;

    font-weight: 700;

    margin: 0;

}


.header-status {

    margin-left: auto;

    font-size: 12px;

    color: #777;

}


/* =========================================================
   EVENT GRID
   ========================================================= */

#events {

    display: grid;

    grid-template-columns:
        repeat(
            var(--columns),
            minmax(0, 1fr)
        );

    gap: var(--gap);

    padding:
        var(--page-padding);

}


/* =========================================================
   EVENT CARD
   ========================================================= */

.event {

    height:
        var(--card-height);

    min-width: 0;

    background:
        #ffffff;

    border-radius:
        var(--radius);

    overflow:
        hidden;

    display:
        flex;

    flex-direction:
        column;

    box-shadow:
        0 1px 5px rgba(0,0,0,0.14);

    cursor:
        pointer;

}


/* =========================================================
   IMAGE
   ========================================================= */

.event-image {

    width: 100%;

    height:
        var(--image-height);

    flex-shrink: 0;

    overflow: hidden;

    background:
        #dddddd;

}


.event-image img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

}


/* =========================================================
   EVENT CONTENT
   ========================================================= */

.event-content {

    padding:
        11px 13px 12px;

    display:
        flex;

    flex-direction:
        column;

    flex: 1;

    min-height: 0;

}


/* =========================================================
   CATEGORY
   ========================================================= */

.event-category {

    font-size:
        var(--category-size);

    line-height: 1.2;

    color:
        #888888;

    font-weight:
        600;

    margin-bottom:
        4px;

}


/* =========================================================
   TITLE
   ========================================================= */

.event-title {

    font-size:
        var(--title-size);

    line-height:
        1.15;

    font-weight:
        700;

    color:
        #111111;

    margin-bottom:
        8px;

}


/* =========================================================
   DATE / TIME
   ========================================================= */

.event-date {

    font-size:
        var(--date-size);

    font-weight:
        600;

    color:
        #222222;

    margin-bottom:
        9px;

}


/* =========================================================
   DESCRIPTION
   ========================================================= */

.event-description {

    font-size:
        var(--description-size);

    line-height:
        1.35;

    color:
        #444444;

    overflow:
        hidden;

    display:
        -webkit-box;

    -webkit-box-orient:
        vertical;

    -webkit-line-clamp:
        7;

}


/* =========================================================
   PRICE
   ========================================================= */

.event-price {

    margin-top:
        auto;

    padding-top:
        8px;

    font-size:
        var(--price-size);

    font-weight:
        700;

    color:
        #111111;

}


/* =========================================================
   NO IMAGE
   ========================================================= */

.no-image {

    width: 100%;

    height: 100%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:
        #999999;

    font-size:
        13px;

}


/* =========================================================
   LOADING
   ========================================================= */

.loading {

    grid-column:
        1 / -1;

    padding:
        50px;

    text-align:
        center;

    color:
        #777;

}


/* =========================================================
   ERROR
   ========================================================= */

.error {

    grid-column:
        1 / -1;

    padding:
        50px;

    text-align:
        center;

    color:
        #b00000;

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 1100px) {

    :root {
        --columns: 3;
    }

}


@media (max-width: 750px) {

    :root {
        --columns: 2;
    }

}


@media (max-width: 480px) {

    :root {
        --columns: 1;
    }

}

</style>

</head>


<body>


<!-- ======================================================
     HEADER
     ====================================================== -->

<header class="header">

    <h1 class="header-title">
        Veranstaltungen Weimar
    </h1>

    <div
        class="header-status"
        id="status"
    >
        Lade …
    </div>

</header>


<!-- ======================================================
     EVENT GRID
     ====================================================== -->

<main id="events">

    <div class="loading">
        Veranstaltungen werden geladen …
    </div>

</main>


<script>

/* =========================================================
   CLOUDFLARE WORKER
   ========================================================= */

const API_URL =
    "https://events.richardthiele03.workers.dev";


/* =========================================================
   NUMBER OF EVENTS
   =========================================================

   16 = 4 × 4

   20 = 5 × 4

   24 = 6 × 4

   32 = 8 × 4

   You can change this independently from
   the number of columns.
   ========================================================= */

const EVENT_COUNT = 16;


/* =========================================================
   REFRESH TIME
   =========================================================

   10 minutes
   ========================================================= */

const REFRESH_TIME =
    10 * 60 * 1000;


/* =========================================================
   LOAD EVENTS
   ========================================================= */

async function loadEvents() {

    const container =
        document.getElementById(
            "events"
        );

    const status =
        document.getElementById(
            "status"
        );


    try {

        status.textContent =
            "Aktualisiere …";


        const response =
            await fetch(
                API_URL + "?t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (
            !data.success ||
            !Array.isArray(
                data.events
            )
        ) {

            throw new Error(
                "Ungültige Daten"
            );

        }


        /*
         * Take only the number
         * requested above.
         */

        const events =
            data.events.slice(
                0,
                EVENT_COUNT
            );


        /*
         * Draw the cards.
         */

        container.innerHTML =
            "";


        if (
            events.length === 0
        ) {

            container.innerHTML = `
                <div class="loading">
                    Keine Veranstaltungen gefunden.
                </div>
            `;

        } else {

            for (
                const event
                of events
            ) {

                container.appendChild(
                    createEventCard(
                        event
                    )
                );

            }

        }


        /*
         * Status
         */

        const now =
            new Date();


        status.textContent =
            `${events.length} Veranstaltungen · ` +
            `${now.toLocaleTimeString(
                "de-DE",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            )}`;


    } catch (error) {

        console.error(
            error
        );


        container.innerHTML = `

            <div class="error">

                Veranstaltungen konnten
                nicht geladen werden.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;


        status.textContent =
            "Fehler";

    }

}


/* =========================================================
   CREATE EVENT CARD
   ========================================================= */

function createEventCard(
    event
) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "event";


    /*
     * Clicking the card opens
     * the original Weimar page.
     */

    card.onclick =
        function () {

            if (event.url) {

                window.open(
                    event.url,
                    "_blank"
                );

            }

        };


    /* =====================================================
       IMAGE
       ===================================================== */

    const imageContainer =
        document.createElement(
            "div"
        );


    imageContainer.className =
        "event-image";


    if (event.image) {

        const image =
            document.createElement(
                "img"
            );


        image.src =
            event.image;


        image.alt =
            event.title || "";


        image.loading =
            "lazy";


        image.onerror =
            function () {

                imageContainer.innerHTML =
                    `<div class="no-image">
                        Kein Bild
                     </div>`;

            };


        imageContainer.appendChild(
            image
        );

    } else {

        imageContainer.innerHTML =
            `<div class="no-image">
                Kein Bild
             </div>`;

    }


    /* =====================================================
       CONTENT
       ===================================================== */

    const content =
        document.createElement(
            "div"
        );


    content.className =
        "event-content";


    /*
     * CATEGORY
     */

    if (event.category) {

        const category =
            document.createElement(
                "div"
            );


        category.className =
            "event-category";


        category.textContent =
            event.category;


        content.appendChild(
            category
        );

    }


    /*
     * TITLE
     */

    const title =
        document.createElement(
            "div"
        );


    title.className =
        "event-title";


    title.textContent =
        event.title ||
        "Veranstaltung";


    content.appendChild(
        title
    );


    /*
     * DATE + TIME
     */

    if (
        event.date ||
        event.time
    ) {

        const date =
            document.createElement(
                "div"
            );


        date.className =
            "event-date";


        let dateText = "";


        if (event.date) {

            dateText +=
                formatDate(
                    event.date
                );

        }


        if (event.time) {

            if (dateText) {

                dateText +=
                    " · ";

            }


            dateText +=
                formatTime(
                    event.time
                );

        }


        date.textContent =
            dateText;


        content.appendChild(
            date
        );

    }


    /*
     * DESCRIPTION
     */

    if (
        event.description
    ) {

        const description =
            document.createElement(
                "div"
            );


        description.className =
            "event-description";


        description.textContent =
            event.description;


        content.appendChild(
            description
        );

    }


    /*
     * PRICE
     *
     * Only displayed when Worker
     * has returned a positive price.
     */

    if (
        event.price &&
        isPositivePrice(
            event.price
        )
    ) {

        const price =
            document.createElement(
                "div"
            );


        price.className =
            "event-price";


        price.textContent =
            event.price;


        content.appendChild(
            price
        );

    }


    /*
     * Assemble card.
     */

    card.appendChild(
        imageContainer
    );


    card.appendChild(
        content
    );


    return card;

}


/* =========================================================
   DATE FORMAT
   ========================================================= */

function formatDate(
    value
) {

    /*
     * Worker already returns
     * dd.mm.yyyy.
     */

    if (
        /^\d{2}\.\d{2}\.\d{4}$/.test(
            value
        )
    ) {

        return value;

    }


    /*
     * Fallback if Worker returns
     * another date format.
     */

    const date =
        new Date(
            value
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return value;

    }


    return date.toLocaleDateString(
        "de-DE"
    );

}


/* =========================================================
   TIME FORMAT
   ========================================================= */

function formatTime(
    value
) {

    if (!value) {
        return "";
    }


    /*
     * Remove an existing "Uhr"
     * so we don't get:
     *
     * 16:00 Uhr Uhr
     */

    return value
        .replace(
            /\s*Uhr\s*$/i,
            ""
        ) +
        " Uhr";

}


/* =========================================================
   PRICE CHECK
   ========================================================= */

function isPositivePrice(
    value
) {

    const number =
        parseFloat(
            String(value)
                .replace(
                    /€/g,
                    ""
                )
                .replace(
                    /\s/g,
                    ""
                )
                .replace(
                    ",",
                    "."
                )
        );


    return (
        Number.isFinite(
            number
        ) &&
        number > 0
    );

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(
    value
) {

    return String(
        value
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

loadEvents();


/* =========================================================
   AUTOMATIC REFRESH
   ========================================================= */

setInterval(
    loadEvents,
    REFRESH_TIME
);

</script>


</body>

</html>
